name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main # Change this if your main branch is called something else (e.g., 'master')
      - master
    paths:
      - 'supabase/functions/**' # Only run when code in the functions folder changes
      - '.github/workflows/deploy-supabase.yml' # Also run when this workflow file changes
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy auto-grade-single
        run: supabase functions deploy auto-grade-single --no-verify-jwt --project-ref $PROJECT_ID

      - name: Deploy format-scheme
        run: supabase functions deploy format-scheme --no-verify-jwt --project-ref $PROJECT_ID

      - name: Deploy grade-exams
        run: supabase functions deploy grade-exams --no-verify-jwt --project-ref $PROJECT_ID

      - name: Deploy auto-grade-appeal
        run: supabase functions deploy auto-grade-appeal --no-verify-jwt --project-ref $PROJECT_ID
