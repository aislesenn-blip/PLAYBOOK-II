<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Playbook - Grade Submissions</title>
    <link href="css/style.css" rel="stylesheet"/>
</head>
<body>
<div class="app-container">
    <nav class="top-nav">
        <div class="nav-content max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="nav-logo"><img src="icons/playbook-icon.png" alt="Playbook Icon" class="logo-icon"> Playbook</div>
                <ul class="nav-links flex gap-1 items-center">
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="upload.html">Upload Exams</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="main-content max-w-7xl mx-auto">
        <header class="page-header mb-2">
            <h1>Grade Digital Submissions</h1>
            <p class="text-secondary" id="session-name">Loading assignment...</p>
        </header>

        <div class="grid gap-2" style="grid-template-columns: 1fr 1fr;">
            <!-- Left Side: Status -->
            <div class="card" style="padding: 1.5rem;">
                <h3 style="margin-top:0;">Submission Status</h3>
                <p>Students who have submitted work:</p>
                <div style="font-size: 3rem; font-weight: bold; color: var(--accent-color);" id="submission-count">0</div>
            </div>

            <!-- Right Side: AI Rubric Upload -->
            <div class="card" style="padding: 1.5rem;">
                <h3 style="margin-top:0;">AI Marking Scheme</h3>
                <p class="text-secondary" style="font-size: 0.9rem; margin-bottom: 1rem;">Provide the marking scheme. Playbook AI will grade all submitted digital PDFs instantly.</p>
                <textarea id="marking-scheme-text" class="form-control" rows="6" placeholder="Paste your rubric or expected answers here..."></textarea>

                <label class="form-label mt-1">Total Assignment Marks</label>
                <input class="form-control" id="total-marks" type="number" value="100"/>

                <button class="btn mt-2" id="start-grading-btn" style="width: 100%;">Grade All Submissions</button>
            </div>
        </div>
    </main>
</div>

<!-- Loading Overlay -->
<div id="loading-overlay">
    <svg class="playbook-loader" viewbox="0 0 540 100" xmlns="http://www.w3.org/2000/svg">
        <path class="playbook-path" d="M30,80 V20 H60 Q80,20 80,40 Q80,60 60,60 H30" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
        <path class="playbook-path" d="M100,80 V20 M100,80 H140" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
        <path class="playbook-path" d="M170,80 L190,20 L210,80 M180,60 H200" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
        <path class="playbook-path" d="M240,20 L260,50 L280,20 M260,50 V80" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
        <path class="playbook-path" d="M300,80 V20 H320 Q340,20 340,35 Q340,50 320,50 Q340,50 340,65 Q340,80 320,80 H300 M300,50 H320" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
        <path class="playbook-path" d="M380,20 Q360,20 360,50 Q360,80 380,80 Q400,80 400,50 Q400,20 380,20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
        <path class="playbook-path" d="M440,20 Q420,20 420,50 Q420,80 440,80 Q460,80 460,50 Q460,20 440,20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
        <path class="playbook-path" d="M480,80 V20 M480,50 L520,20 M480,50 L520,80" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
    </svg>
    <h2 id="loading-status" style="margin-top: 1.5rem;">Processing...</h2>
</div>

<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<!-- Assuming you use a serverless edge function for grading these, we leave the JS logic simple -->
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session_id');
    if (!sessionId) {
        alert("No session ID provided.");
        return;
    }

    try {
        const session = await window.PlaybookDB.getSession(sessionId);
        document.getElementById('session-name').innerText = session.name;

        const submissions = await window.PlaybookDB.getSubmissionsBySession(sessionId);
        document.getElementById('submission-count').innerText = submissions.length;

    } catch (e) {
        console.error(e);
        alert("Failed to load session data.");
    }

    document.getElementById('start-grading-btn').addEventListener('click', async () => {
        const scheme = document.getElementById('marking-scheme-text').value;
        const maxMarks = document.getElementById('total-marks').value;

        if (!scheme) {
            alert("Please provide a marking scheme.");
            return;
        }

        document.getElementById('loading-overlay').style.display = 'flex';
        document.getElementById('loading-status').innerText = 'Initializing AI Grading...';

        try {
            // Save the marking scheme to the session
            await window.PlaybookDB.saveSession({
                id: sessionId,
                marking_scheme: scheme,
                max_score: maxMarks,
                status: 'processing' // this would trigger a backend edge function in a real env
            });

            // In a fully built app, you would call PlaybookAI or your edge function here to actually iterate through `submissions`
            // For now, we simulate success and redirect to review
            setTimeout(() => {
                alert("Grading initiated successfully! In a live environment, edge functions would process the PDFs.");
                window.location.href = `review.html?session_id=${sessionId}`;
            }, 2000);

        } catch (e) {
            console.error(e);
            alert("Failed to initiate grading.");
            document.getElementById('loading-overlay').style.display = 'none';
        }
    });
});
</script>
</body>
</html>
