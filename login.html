<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playbook - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-color);
        }
        .login-card {
            background: var(--surface-color);
            padding: var(--spacing-lg) var(--spacing-md);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-logo {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: var(--spacing-sm);
            letter-spacing: -0.02em;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">Playbook</div>
        <p class="mb-2" style="color: var(--text-secondary);">Enterprise SSO Login</p>

        <form id="login-form">
            <div class="form-group text-left" style="text-align: left;">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="professor@stanford.edu" required>
            </div>
            <div class="form-group" style="text-align: left;">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn mt-1" style="width: 100%;">Sign In</button>
        </form>

        <div class="mt-2 pt-1" style="border-top: 1px solid var(--border-color); font-size: 0.85rem; color: var(--text-secondary);">
            <p><strong>Demo Mode Quick Login:</strong></p>
            <p>Admin: admin@playbook.edu</p>
            <p>Teacher: prof@playbook.edu</p>
            <p style="font-size: 0.75rem; margin-top: 0.5rem;">(Any password will work)</p>
        </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
