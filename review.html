<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playbook - Review & Override</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .grading-item {
            border: 1px solid var(--border-color);
            padding: var(--spacing-sm);
            background-color: var(--surface-color);
        }
        .grading-item.editing {
            border-color: var(--accent-color);
            background-color: #fafafa;
        }
        .grading-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: var(--spacing-xs);
            margin-bottom: var(--spacing-xs);
        }
        .score-display {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .feedback-box {
            background-color: var(--bg-color);
            padding: var(--spacing-sm);
            font-size: 0.95rem;
            color: var(--text-secondary);
            border-left: 3px solid var(--accent-color);
        }
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-sm) var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
            background-color: var(--surface-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }
    </style>
</head>
<body style="overflow: hidden;"> <!-- Prevent body scroll for split layout -->

    <!-- Top Nav -->
    <header class="nav-header">
        <div class="flex items-center gap-2">
            <a href="index.html" style="font-family: var(--font-serif); font-size: 1.5rem; font-weight: 600; text-transform: uppercase;">Playbook</a>
            <span style="color: var(--text-secondary);">|</span>
            <span style="font-weight: 500;" id="session-title">Loading Session...</span>
        </div>

        <div class="flex items-center gap-1">
            <span style="font-size: 0.9rem; color: var(--text-secondary);">Student <span id="current-student-idx">0</span> of <span id="total-student-count">0</span>: <strong style="color: var(--text-primary);" id="student-name">...</strong> (<span id="student-reg-num">...</span>)</span>
            <button class="btn btn-secondary" id="prev-btn" style="padding: 0.5rem 1rem;" disabled>&larr; Prev</button>
            <button class="btn btn-secondary" id="next-btn" style="padding: 0.5rem 1rem;">Next &rarr;</button>
        </div>

        <div>
            <button id="finalize-btn" class="btn">Finalize Scores</button>
        </div>
    </header>

    <div class="app-container" style="display: block; padding: var(--spacing-lg); height: calc(100vh - 4rem - 2px); box-sizing: border-box;">

        <div class="split-layout" style="height: 100%;">

            <!-- Left: Document Preview -->
            <div class="document-preview card" style="margin: 0; padding: 0;" id="document-preview-container">
                <div class="flex-col items-center" style="color: var(--text-secondary); opacity: 0.5; width: 100%; height: 100%; justify-content: center; display: flex;">
                    <p>Loading document...</p>
                </div>
            </div>

            <!-- Right: Grading Panel -->
            <div class="grading-panel">
                <div class="flex justify-between items-center mb-1">
                    <h2>Playbook Evaluation</h2>
                    <div style="text-align: right;">
                        <span style="font-size: 0.8rem; text-transform: uppercase; color: var(--text-secondary);">Total Score</span>
                        <div style="font-family: var(--font-serif); font-size: 2rem;" id="total-score-display">0 / 0</div>
                    </div>
                </div>

                <div id="grading-items-container">
                    <!-- Populated by JS -->
                </div>

            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/review.js"></script>
</body>
</html>
